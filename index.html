
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ec0075">
  <title>Alerta Financeiro | Simulação Educativa</title>

  <style>
    :root {
      --rosa: #ec0075;
      --rosa-claro: #ff5a98;
      --texto: #14213d;
      --cartao: #f5f6f8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: var(--texto);
    }

    .header {
      height: 62px;
      background: var(--rosa);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      position: relative;
      z-index: 5;
    }

    .header a {
      text-decoration: none;
      color: white;
    }

    .menu, .login {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
    }

    .brand {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand img {
      display: block;
      max-width: 112px;
      max-height: 38px;
      object-fit: contain;
    }

    /* BANNER PRINCIPAL */
    .hero {
      height: 485px;
      position: relative;
      overflow: hidden;
      background: var(--rosa-claro);
    }

    .shape {
      position: absolute;
      width: 120%;
      height: 125px;
      top: 125px;
      left: -8%;
      background: white;
      border-radius: 25px;
      transform: rotate(18deg);
    }

    .shape-two {
      position: absolute;
      width: 48%;
      height: 260px;
      top: -50px;
      right: -12%;
      border-radius: 30px;
      background: #ffa3c5;
      transform: rotate(17deg);
    }

    .banner-image {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .banner-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* CARTÃO PRINCIPAL */
    .content {
      position: relative;
      z-index: 3;
      margin: -117px 13px 22px;
      padding: 17px 16px 16px;
      background: var(--cartao);
      border-radius: 17px;
      box-shadow: 0 3px 12px #00000008;
    }

    .demo {
      display: inline-block;
      margin-bottom: 9px;
      padding: 5px 8px;
      border-radius: 5px;
      background: #ffe0ef;
      color: #a30052;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: .4px;
    }

    h1 {
      margin-bottom: 14px;
      color: var(--texto);
      font-size: 25px;
      line-height: 1.25;
      letter-spacing: -.6px;
    }

    .description {
      margin-bottom: 10px;
      color: #25334b;
      font-size: 16px;
      line-height: 1.55;
    }

    /* CAMPO DE TEXTO */
    .campo-cpf {
      margin: 16px 0;
      padding: 11px 13px;
      background: #fff;
      border: 1px solid #cfd3da;
      border-radius: 9px;
      text-align: left;
      transition: border-color .2s, box-shadow .2s;
    }

    .campo-cpf:focus-within {
      border-color: var(--rosa);
      box-shadow: 0 0 0 2px #ec00751c;
    }

    .campo-cpf label {
      display: block;
      margin-bottom: 7px;
      color: #343b49;
      font-size: 12px;
      font-weight: 600;
    }

    .campo-cpf input {
      display: block;
      width: 100%;
      min-height: 28px;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--texto);
      font-family: inherit;
      font-size: 17px;
    }

    .campo-cpf input::placeholder {
      color: #969daa;
    }

    .campo-cpf small {
      display: block;
      margin-top: 7px;
      color: #626b79;
      font-size: 11px;
      line-height: 1.4;
    }

    .cta {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 9px;
      background: var(--rosa);
      color: white;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background .2s;
    }

    .cta:hover {
      background: #c90063;
    }

    .notice {
      margin-top: 14px;
      color: #5d6471;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .educational {
      padding: 25px 20px 35px;
      text-align: center;
      scroll-margin-top: 20px;
    }

    .educational h2 {
      margin-bottom: 12px;
      font-size: 22px;
    }

    .educational p {
      max-width: 500px;
      margin: 0 auto 12px;
      color: #4a5568;
      font-size: 15px;
      line-height: 1.65;
    }

    .footer {
      padding: 18px;
      background: #f5f6f8;
      color: #606979;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    @media (min-width: 600px) {
      body {
        background: #ececf0;
      }

      .header {
        padding: 0 28px;
      }

      .hero {
        height: 560px;
      }

      .content {
        max-width: 500px;
        margin: -115px auto 25px;
        padding: 25px;
      }

      h1 {
        font-size: 30px;
      }

      .educational {
        max-width: 650px;
        margin: auto;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <a href="#inicio" class="menu">
      <span aria-hidden="true">☰</span>
      Menu
    </a>

    <a href="#inicio" class="brand" aria-label="Página inicial">
      <img
        src="img/logosr.png"
        alt="Logo ilustrativa"
        onerror="this.style.display='none';"
      >
    </a>

    <a href="#aviso" class="login">
      <span aria-hidden="true">●</span>
      Sobre
    </a>
  </header>

  <main id="inicio">
    <section class="hero" aria-label="Banner ilustrativo">
      <div class="shape"></div>
      <div class="shape-two"></div>

      <div class="banner-image">
        <img
          src="img/banner01.webp"
          alt="Banner ilustrativo da página"
        >
      </div>
    </section>

    <section class="content">
      <span class="demo">Serasa Experian</span>

      <h1>Consulte Valores a Receber Agora Mesmo!</h1>

      <p class="description">
        Número do CPF
      </p>

      <form id="form-cpf">
        <div class="campo-cpf">
          <label for="cpf">CPF</label>

          <input
            type="text"
            id="cpf"
            name="cpf"
            placeholder="000.000.000-00"
            inputmode="numeric"
            maxlength="14"
            autocomplete="off"
            aria-describedby="aviso-cpf"
          >

          <small id="aviso-cpf">
          </small>
        </div>

        <button class="cta" type="submit">
          Ver demonstração
        </button>
      </form>

      <p class="notice" id="resultado-cpf" role="status">
        Digite seu CPF para consultar saldo disponível para receber.
      </p>
    </section>



  <footer class="footer">
    Projeto demonstrativo de conscientização digital.<br>
    Página independente, sem vínculo com instituições financeiras.
  </footer>

  <script>
    const campoCpf = document.getElementById("cpf");
    const formCpf = document.getElementById("form-cpf");
    const resultadoCpf = document.getElementById("resultado-cpf");

    campoCpf.addEventListener("input", () => {
      let numeros = campoCpf.value
        .replace(/\D/g, "")
        .slice(0, 11);

      if (numeros.length > 9) {
        numeros = numeros.replace(
          /^(\d{3})(\d{3})(\d{3})(\d{0,2})$/,
          "$1.$2.$3-$4"
        );
      } else if (numeros.length > 6) {
        numeros = numeros.replace(
          /^(\d{3})(\d{3})(\d{0,3})$/,
          "$1.$2.$3"
        );
      } else if (numeros.length > 3) {
        numeros = numeros.replace(
          /^(\d{3})(\d{0,3})$/,
          "$1.$2"
        );
      }

      campoCpf.value = numeros;
    });

    formCpf.addEventListener("submit", (event) => {
      event.preventDefault();

      resultadoCpf.textContent =
        "Demonstração concluída. Nenhum dado foi enviado ou consultado.";
    });
  </script>
</body>
</html>
